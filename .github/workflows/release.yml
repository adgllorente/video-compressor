name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            script: scripts/package-macos.sh
            asset: dist/CompresorVideo-macos.zip
          - os: windows-latest
            script: scripts/package-windows.sh
            asset: dist/CompresorVideo-windows.zip
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target || 'aarch64-apple-darwin' }}
      - name: Empaquetar
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: ${{ matrix.asset }}
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
